<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24283b"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb86b"/>
      <stop offset="1" stop-color="#e0662b"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9f27c"/>
      <stop offset="1" stop-color="#4fbf7a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="#3b4261" stroke-width="4"/>
  <!-- prompt > -->
  <path d="M104 150 L214 232 L104 314" fill="none" stroke="url(#rust)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- check -->
  <path d="M254 238 L316 300 L424 168" fill="none" stroke="url(#ok)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor -->
  <rect x="104" y="372" width="150" height="34" rx="17" fill="#7aa2f7"/>
  <rect x="274" y="372" width="64" height="34" rx="17" fill="#7aa2f7" opacity=".45"/>
  <rect x="358" y="372" width="50" height="34" rx="17" fill="#7aa2f7" opacity=".2"/>
</svg>
