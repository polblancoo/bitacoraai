[package]
name = "bitacora-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Modelos y contratos de API compartidos por BitacoraAI (servidor, TUI y cliente Tauri)"
readme = "../../README.md"
keywords = ["project-management", "tasks", "ai-agents", "collaboration", "self-hosted"]
categories = ["command-line-utilities"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
