[package]
name = "rust-tui-manager"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Cliente de terminal (ratatui) del tablero de comando rust-tui-manager: proyectos y tareas con personas e IAs"
readme = "README.md"
keywords = ["project-management", "tasks", "ai-agents", "collaboration", "self-hosted"]
categories = ["command-line-utilities"]

[dependencies]
tm-core = { package = "rust-tui-manager-core", path = "../core", version = "0.5.1" }
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
directories = "5"
