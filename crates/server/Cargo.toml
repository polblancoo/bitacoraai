[package]
name = "bitacora-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Tablero de comando self-hosted para proyectos con personas e IAs (axum + SQLite + WebSocket): equipos, tareas, roles, invitaciones y cuentas de IA"
readme = "README.md"
keywords = ["project-management", "tasks", "ai-agents", "collaboration", "self-hosted"]
categories = ["command-line-utilities"]

[[bin]]
name = "tm-server"
path = "src/main.rs"

[features]
# Enlaza el módulo cerrado «pro» (crate privado crewhelm-pro, que agrega la CI privada al compilar los binarios oficiales).
pro = []

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
chrono = "0.4.45"
futures-util = "0.3.34"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "set-header", "trace", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.0", features = ["v4"] }
tm-core = { package = "bitacora-core", path = "../core", version = "0.7.2" }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
russh = "0.65"
rustls = "0.23.46"
sha2 = "0.11.1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
getrandom = "0.3"
aes-gcm = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "hostname", "webpki-roots"] }
rcgen = "0.13.2"
dav-server = "0.11"
base64 = "0.22"
sha1 = "0.10"
