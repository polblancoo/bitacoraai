[package]
name = "rust-tui-manager-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "tm-agent: vigila el tablero de comando rust-tui-manager y pone a trabajar a una IA cuando le asignan una tarea"
readme = "README.md"
keywords = ["project-management", "ai-agents", "automation", "mcp", "self-hosted"]
categories = ["command-line-utilities"]

[[bin]]
name = "tm-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
