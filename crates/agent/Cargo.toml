[package]
name = "crewhelm-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "tm-agent: vigila el tablero de comando CrewHelm y pone a trabajar a una IA cuando le asignan una tarea"
readme = "README.md"
keywords = ["project-management", "ai-agents", "automation", "mcp", "self-hosted"]
categories = ["command-line-utilities"]

[[bin]]
name = "tm-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
futures-util = "0.3.34"
portable-pty = "0.9.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "net", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
